[workspace]
members = [
    "crates/multiviewer-mf",
    "crates/multiviewer-pipeline",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.1.4", default-features = false, features = ["std", "derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "std"] }
gstreamer = "0.24.4"
ctrlc = "3.4.2"
