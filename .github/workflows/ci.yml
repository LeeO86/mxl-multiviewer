name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            unzip \
            zip \
            tar \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libgtk-4-dev \
            libatk1.0-dev \
            librdmacm-dev

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg /home/runner/vcpkg
          /home/runner/vcpkg/bootstrap-vcpkg.sh --disableMetrics
        shell: bash

      - name: Install libfabric
        run: sudo ./.devcontainer/scripts/common/libfabric/install.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            mxl/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gst-mxl-rs (and MXL native lib)
        env:
          VCPKG_ROOT: /home/runner/vcpkg
        run: cargo build -p gst-mxl-rs --release --manifest-path mxl/rust/Cargo.toml

      - name: Build multiviewer MediaFunction
        env:
          VCPKG_ROOT: /home/runner/vcpkg
        run: cargo build -p multiviewer-mf --release

      - name: Build container image
        run: docker build -t mxl-multiviewer:ci .

      - name: Smoke test
        run: docker run --rm mxl-multiviewer:ci --help
