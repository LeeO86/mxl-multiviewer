# Pod network. The platform reaches the UI through ingress; MXL domains are the
# hostPath below, not the host network. GPU nodes: use deploy/mxl-multiviewer-gpu.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mxl-multiviewer
data:
  MXL_DOMAIN_SCAN_PATH: /Volumes/mxl
  MXL_OUTPUT_DOMAIN_DIR: /Volumes/mxl/multiviewer
  MXL_CLEANUP_ON_EXIT: "true"
  MV_STATE_DIR: /config
  MV_BACKEND: auto
  MV_MAX_INPUTS: "16"
  MV_OUTPUT_FORMAT: 1920x1080p50
  NMOS_ENABLE: "true"
  NMOS_DNS_SD: "false"
  NMOS_SEED: example-multiviewer
  NMOS_LABEL: multiviewer
  NMOS_TAGS: '{"urn:x-srf:production":["example"],"urn:x-srf:function":["multiviewer"]}'
  NMOS_REGISTRY_ADDRESS: nmos-registry.nmos.svc
  NMOS_REGISTRY_PORT: "3210"
  NMOS_PORT: "3262"
  WEB_PORT: "8110"
  TSL_UDP_PORT: "8910"
  TSL_TCP_PORT: "8911"
  SHUTDOWN_TIMEOUT_S: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mxl-multiviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mxl-multiviewer
  template:
    metadata:
      labels:
        app: mxl-multiviewer
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [1000]
        fsGroup: 1000
      containers:
        - name: mxl-multiviewer
          image: ghcr.io/leeo86/mxl-multiviewer:1.1.0
          env:
            - name: NMOS_HOST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: mxl-multiviewer
          ports:
            - name: web
              containerPort: 8110
            - name: nmos
              containerPort: 3262
            - name: nmos-ws
              containerPort: 3263
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8110
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8110
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: mxl
              mountPath: /Volumes/mxl
            - name: config
              mountPath: /config
      volumes:
        - name: mxl
          hostPath:
            path: /Volumes/mxl
            type: Directory
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mxl-multiviewer
  labels:
    app: mxl-multiviewer
spec:
  selector:
    app: mxl-multiviewer
  ports:
    - name: web
      port: 8110
      targetPort: 8110
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mxl-multiviewer
spec:
  selector:
    matchLabels:
      app: mxl-multiviewer
  endpoints:
    - port: web
      path: /metrics
      interval: 15s
